name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install pandoc (the sandbox runner's HTML conversion is tested for real)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - name: Build (Release, warnings are errors)
        run: dotnet build -c Release
      - name: Test (includes the OpenAPI and event-fixture snapshot tests)
        run: dotnet test -c Release --no-build

  ui:
    name: UI lint, typecheck, test, contract, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated API types match the OpenAPI snapshot
        run: npm run check:api
      - run: npm run build

  e2e:
    name: Playwright e2e (Chromium)
    needs: [dotnet, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Build the UI (served by the e2e gateway from ui/dist)
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e (e2e/stack.sh starts an isolated gateway + agent)
        run: npm run test:e2e -- --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: /tmp/sharpclaw-e2e/*.log
          retention-days: 7
