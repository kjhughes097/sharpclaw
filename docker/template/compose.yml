name: sharpclaw

networks:
  internal:
    internal: true # no route to the outside world
  external: {}
  # One network per sandbox, holding only the gateway and that sandbox: no route out (its only exit
  # is the gateway's egress proxy), and no way to reach another sandbox or any agent.
  sbx-assistant:
    internal: true

volumes:
  # Per-agent package caches (NuGet, npm, pip); never shared between agents.
  sandbox-assistant-cache: {}

x-agent: &agent
  image: sharpclaw-agent:${SHARPCLAW_TAG:-latest}
  # Run as the host user that owns ./agents/<name>/workspace so workspace tools can write there.
  user: "${SHARPCLAW_UID:-1000}:${SHARPCLAW_GID:-1000}"
  depends_on:
    gateway: { condition: service_healthy }
  networks: [internal] # internal only: never give an agent the external network
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# A sandbox runs code and parses untrusted input for one agent (external tools). It holds no
# secrets except its own two, and only starts with COMPOSE_PROFILES=sandboxes in .env.
x-sandbox: &sandbox
  image: sharpclaw-sandbox:${SHARPCLAW_TAG:-latest}
  # Same host user as the agent, so files it writes in the workspace stay editable.
  user: "${SHARPCLAW_UID:-1000}:${SHARPCLAW_GID:-1000}"
  profiles: [sandboxes]
  read_only: true
  tmpfs: ["/tmp:exec,mode=1777,size=2g"] # builds need an executable /tmp; HOME lives here
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2
  restart: unless-stopped

services:
  gateway:
    image: sharpclaw-gateway:${SHARPCLAW_TAG:-latest}
    # Same host user as the agents so the gateway can write the ./data bind mount.
    user: "${SHARPCLAW_UID:-1000}:${SHARPCLAW_GID:-1000}"
    environment:
      Auth__AdminKey: ${ADMIN_KEY}
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__ManagementKey: ${OPENROUTER_MANAGEMENT_KEY:-}
      Provider__Type: ${PROVIDER_TYPE:-OpenRouter}
      Fake__ScriptPath: ${FAKE_SCRIPT_PATH:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_SERVICE_NAME: sharpclaw-gateway
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=home
      # Internal listener ports (never published): agents use the agent port, sandboxes the egress
      # proxy. The client listener stays on 8080 inside the container; CLIENT_PORT publishes it.
      Listeners__AgentPort: ${AGENT_PORT:-8081}
      Egress__Port: ${EGRESS_PORT:-8082}
      # Models a session may switch to, e.g.:
      # Models__Allowed__0: openai/gpt-4o-mini
      # External tools for agent-assistant (see README). Empty secrets mean no sandbox; nothing is
      # enabled until you list tools, or set AllTools to enable every broker tool, e.g.:
      # ToolBroker__Agents__assistant__AllTools: "true"
      # ToolBroker__Agents__assistant__Tools__0: http_fetch
      # ToolBroker__Agents__assistant__Tools__1: download_to_workspace
      ToolBroker__Agents__assistant__SandboxUrl: http://sandbox-assistant:8090
      ToolBroker__Agents__assistant__SandboxSecret: ${SANDBOX_ASSISTANT_SECRET:-}
      Egress__Sandboxes__assistant__Secret: ${SANDBOX_ASSISTANT_PROXY_SECRET:-}
      # The cheap model that runs web_search (default openai/gpt-4o-mini), e.g.:
      # WebSearch__Model: openai/gpt-4o-mini
      # GitHub tools (github_read/github_write/github_create_pr). Empty tokens = off. Optional
      # allow-list, required for github_create_pr: GitHub__Repos__0: owner/repo
      GitHub__Token: ${GITHUB_TOKEN:-}
      GitHub__ForkToken: ${GITHUB_FORK_TOKEN:-}
      GitHub__ForkOwner: ${GITHUB_FORK_OWNER:-}
      # Hosts whose http_fetch calls are low risk, e.g.:
      # ToolBroker__FetchAllowHosts__0: learn.microsoft.com
    ports:
      # Client API and web UI only; the agent port is never published. Never port-forward this port.
      - "${CLIENT_BIND:-127.0.0.1}:${CLIENT_PORT:-8080}:8080"
    # The egress proxy is reachable only on these networks and is never published.
    networks: [internal, external, sbx-assistant]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "dotnet", "SharpClaw.Gateway.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # One service per agent. To add one, copy this block (and its sandbox's), rename it, add its
  # token to .env and create ./agents/<name>/config/{soul.md,agent.json} and
  # ./agents/<name>/workspace/ (or let scripts/quickstart.sh do all of it). Every agent mounts
  # the shared skill library ./skills read-only; it is used only when agent.json enables skill_read.
  agent-assistant:
    <<: *agent
    environment:
      GATEWAY_URL: http://gateway:${AGENT_PORT:-8081}
      AGENT_TOKEN: ${AGENT_ASSISTANT_TOKEN}
      AGENT_CONFIG_PATH: /config/agent.json
    volumes:
      - ./agents/assistant/config:/config:ro
      - ./agents/assistant/workspace:/workspace
      - ./skills:/skills:ro

  sandbox-assistant:
    # The assistant's sandbox: its own workspace (rw) and cache, the skill library (ro, so skill
    # scripts can run through sandbox_run), its own network, egress only through the gateway's
    # proxy with its own credential.
    <<: *sandbox
    environment:
      SANDBOX_SECRET: ${SANDBOX_ASSISTANT_SECRET:-}
      HTTP_PROXY: http://sbx-assistant:${SANDBOX_ASSISTANT_PROXY_SECRET:-}@gateway:${EGRESS_PORT:-8082}
      HTTPS_PROXY: http://sbx-assistant:${SANDBOX_ASSISTANT_PROXY_SECRET:-}@gateway:${EGRESS_PORT:-8082}
      NO_PROXY: ""
    networks: [sbx-assistant]
    volumes:
      - ./agents/assistant/workspace:/workspace
      - sandbox-assistant-cache:/cache
      - ./skills:/skills:ro
