name: sharpclaw

networks:
  internal:
    internal: true # no route to the outside world
  external: {}

volumes:
  gateway-data: {}

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      Auth__AdminKey: ${ADMIN_KEY}
      OpenRouter__ApiKey: ${OPENROUTER_API_KEY:-}
      OpenRouter__ManagementKey: ${OPENROUTER_MANAGEMENT_KEY:-}
      Provider__Type: ${PROVIDER_TYPE:-OpenRouter}
      Fake__ScriptPath: ${FAKE_SCRIPT_PATH:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_SERVICE_NAME: sharpclaw-gateway
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=home
    ports:
      # Client API and web UI only; 8081 is never published. Set CLIENT_BIND to the host's LAN
      # address (or 0.0.0.0) to reach the UI from other devices. Never port-forward 8080.
      - "${CLIENT_BIND:-127.0.0.1}:8080:8080"
    networks: [internal, external]
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "dotnet", "SharpClaw.Gateway.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  agent-ade:
    build: { context: .., dockerfile: docker/Dockerfile.agent }
    # Run as the host user that owns ./agents/<name>/workspace so workspace tools can write
    # there (the image's default 'app' user has a different uid). Still non-root.
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      GATEWAY_URL: http://gateway:8081
      AGENT_TOKEN: ${AGENT_ADE_TOKEN}
      AGENT_CONFIG_PATH: /config/agent.json # tool policy, read-only mount (3.2)
    networks: [internal] # internal only
    volumes:
      - ./agents/ade/config:/config:ro
      - ./agents/ade/workspace:/workspace
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  agent-cody:
    build: { context: .., dockerfile: docker/Dockerfile.agent }
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    depends_on:
      gateway: { condition: service_healthy }
    environment:
      GATEWAY_URL: http://gateway:8081
      AGENT_TOKEN: ${AGENT_CODY_TOKEN}
      AGENT_CONFIG_PATH: /config/agent.json
    networks: [internal] # internal only
    volumes:
      - ./agents/cody/config:/config:ro
      - ./agents/cody/workspace:/workspace
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
