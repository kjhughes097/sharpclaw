# Development override, copied to docker/.dev/compose.override.yml by scripts/dev-stack.sh (see
# docs/ui.md). The fake provider means no OpenRouter key or spend. The extra allowed origin lets the
# Vite dev server's cookie-authenticated requests pass the gateway's origin check; it must never
# appear in the template compose.yml.
name: sharpclaw-dev

services:
  gateway:
    environment:
      Provider__Type: Fake
      Auth__AllowedOrigins__0: http://localhost:5173
